<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Nights</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d18; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  body { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="game" aria-label="Leonida Nights: an open-world crime game. Explore the neon city, steal cars, outrun the police and finish missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
